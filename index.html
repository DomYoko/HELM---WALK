<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Vessel Walkthrough</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane instrument console. Left = object index + work log, centre = 3D viewport (orbit or walk), right = selected-object card with its details, defects and jobs. Committed dark (bridge at night). */
:root {
  --hull: #0d1620;        /* page ground */
  --deck: #142231;        /* panels */
  --rail: #22364a;        /* hairlines */
  --ink: #e4ecf3;         /* primary text */
  --mist: #8ea3b6;        /* secondary text */
  --signal: #ff8a3d;      /* international orange: selection + accent */
  --job: #5cb8e6; --ok: #5cc98a; --warn: #f2c14e; --bad: #ff5d5d;
  --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--hull); color: var(--ink); font: 15px/1.45 var(--body); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 300px minmax(0,1fr) 330px; grid-template-rows: auto minmax(0,1fr); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 10px 16px; border-bottom: 1px solid var(--rail); background: var(--deck); }
header h1 { margin: 0; font: 600 18px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
header .file { font: 12px var(--mono); color: var(--mist); min-width: 0; overflow-wrap: anywhere; }
header .spacer { flex: 1; }
.btn { background: transparent; border: 1px solid var(--rail); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--signal); color: var(--signal); }
.btn.on { background: var(--signal); border-color: var(--signal); color: var(--hull); }

aside { background: var(--deck); overflow-y: auto; min-width: 0; }
#left { border-right: 1px solid var(--rail); }
#right { border-left: 1px solid var(--rail); }
section { padding: 14px 16px; border-bottom: 1px solid var(--rail); }
.label { font: 600 11px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--mist); margin: 0 0 10px; }

.audit { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.audit li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: baseline; font-size: 13.5px; }
.audit .dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.audit .v { font: 12px var(--mono); color: var(--mist); font-variant-numeric: tabular-nums; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

#search { width: 100%; background: var(--hull); border: 1px solid var(--rail); border-radius: 4px; color: var(--ink); padding: 7px 10px; font: 16px var(--body); }
#list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
#list button { width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
#list button:hover { background: var(--rail); }
#list button.sel { background: var(--signal); color: var(--hull); }
#list .tag { font: 11px var(--mono); opacity: .7; white-space: nowrap; }

main { position: relative; min-width: 0; min-height: 0; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; touch-action: none; }
#tip { position: absolute; pointer-events: none; background: var(--hull); border: 1px solid var(--signal); color: var(--ink); font: 12px var(--mono); padding: 3px 7px; border-radius: 3px; white-space: nowrap; }
#drop { position: absolute; inset: 12px; border: 2px dashed var(--signal); border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--hull) 80%, transparent); font: 600 20px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.hint { position: absolute; left: 12px; bottom: 12px; font: 11.5px var(--mono); color: var(--mist); background: color-mix(in srgb, var(--hull) 75%, transparent); padding: 4px 8px; border-radius: 3px; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mist); font: 13px var(--mono); }

.card h2 { margin: 0 0 4px; font: 600 24px/1.1 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.card .path { font: 12px var(--mono); color: var(--mist); overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
dt { color: var(--mist); }
dd { margin: 0; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.empty { color: var(--mist); font-size: 13.5px; }
.flag { border-left: 3px solid var(--warn); padding: 8px 10px; background: color-mix(in srgb, var(--warn) 10%, transparent); font-size: 13px; }
.flag.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.flag + .flag { margin-top: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
pre.sample { font: 11.5px/1.5 var(--mono); background: var(--hull); border: 1px solid var(--rail); border-radius: 4px; padding: 10px; overflow-x: auto; margin: 8px 0 0; color: var(--mist); }


.tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.tabs .btn { flex: 1; }
details.auditbox summary { cursor: pointer; }
details.auditbox summary .label { display: inline; }
details.auditbox[open] summary { margin-bottom: 10px; }
#log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#log button { width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 6px 8px; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; font-size: 13.5px; }
#log button:hover { background: var(--rail); }
.glyph { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 11px/1 var(--mono); color: var(--hull); background: var(--bad); flex: none; }
.glyph.job { background: var(--job); } .glyph.closed { background: var(--mist); }
.sub { display: block; font: 11.5px var(--mono); color: var(--mist); overflow-wrap: anywhere; }
.count { font: 11px var(--mono); border-radius: 9px; padding: 1px 6px; background: var(--bad); color: var(--hull); }
.recs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.recs li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; }
.recs .t { font-weight: 500; overflow-wrap: anywhere; }
.recs .closed .t { text-decoration: line-through; color: var(--mist); }
.recs p { margin: 2px 0 0; font-size: 13px; color: var(--mist); overflow-wrap: anywhere; }
.link { background: none; border: 0; padding: 0; color: var(--signal); cursor: pointer; font: 12px var(--mono); margin-right: 10px; }
.link:hover { text-decoration: underline; }
form.rec, form.field { display: grid; gap: 8px; margin-top: 12px; }
form.field { grid-template-columns: minmax(0,1fr) minmax(0,1.4fr) auto; }
form input, form select, form textarea { width: 100%; min-width: 0; background: var(--hull); border: 1px solid var(--rail); border-radius: 4px; color: var(--ink); padding: 7px 10px; font: 16px var(--body); }
form textarea { min-height: 64px; resize: vertical; }
form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--mist); }
form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
dd .link { margin: 0 0 0 8px; }
#pad { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; }
#pad button { background: color-mix(in srgb, var(--hull) 75%, transparent); border: 1px solid var(--rail); border-radius: 4px; cursor: pointer; font: 16px var(--mono); touch-action: none; user-select: none; }
#pad button:active { border-color: var(--signal); color: var(--signal); }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--hull); border: 1px solid var(--signal); padding: 6px 12px; border-radius: 4px; font-size: 13px; max-width: calc(100% - 32px); }
.hint { max-width: calc(100% - 180px); }
.store { font: 11.5px var(--mono); color: var(--mist); }
.app { grid-template-columns: 300px minmax(0,1fr); }
/* Selected-object popout: frosted glass over the 3D view. */
#card { position: absolute; top: 12px; right: 12px; width: min(350px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; padding: 18px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--ink) 16%, transparent), color-mix(in srgb, var(--deck) 46%, transparent) 45%, color-mix(in srgb, var(--hull) 58%, transparent));
  -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%);
  border: 1px solid color-mix(in srgb, var(--ink) 26%, transparent); border-radius: 20px;
  box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 38%, transparent), inset 0 -1px 0 color-mix(in srgb, var(--ink) 8%, transparent), 0 18px 48px color-mix(in srgb, var(--hull) 70%, transparent); }
#card h2 { padding-right: 36px; }
#card .label, #card dt, #card .path, #card .sub, #card .empty, #card form label { color: color-mix(in srgb, var(--ink) 72%, var(--mist)); }
#card .btn { border-color: color-mix(in srgb, var(--ink) 30%, transparent); background: color-mix(in srgb, var(--ink) 7%, transparent); }
#card .btn.on { background: var(--signal); border-color: var(--signal); }
#card form input, #card form select, #card form textarea { background: color-mix(in srgb, var(--hull) 55%, transparent); border-color: color-mix(in srgb, var(--ink) 24%, transparent); }
#bClose { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font: 18px/1 var(--body);
  border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); background: color-mix(in srgb, var(--ink) 10%, transparent); }
#bClose:hover { border-color: var(--signal); color: var(--signal); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font: 12px var(--mono); border: 1px solid var(--signal); color: var(--signal); border-radius: 999px; padding: 3px 9px; background: transparent; cursor: pointer; }
.chip.off { border-color: var(--rail); color: var(--mist); text-decoration: line-through; }
.catrow { display: grid; gap: 4px; font-size: 12.5px; margin-top: 14px; }
#catSel { width: 100%; background: color-mix(in srgb, var(--hull) 55%, transparent); border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent); border-radius: 4px; color: var(--ink); padding: 7px 10px; font: 16px var(--body); }
#aim { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid var(--signal); border-radius: 50%; pointer-events: none; }

@media (max-width: 900px) {
  .app { height: auto; grid-template-columns: minmax(0,1fr); grid-template-rows: auto 60vh auto auto; }
  main { grid-row: 2; } #right { grid-row: 3; border-left: 0; } #left { grid-row: 4; border-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Vessel Walkthrough</h1>
    <span class="file" id="fileName">Loading…</span>
    <span class="store" id="storeState"></span>
    <span class="spacer"></span>
    <div class="row">
      <button class="btn" id="btnWalk" type="button" title="Space">Walk</button>
      <button class="btn" id="btnXray" type="button">X-ray</button>
      <button class="btn" id="btnShow" type="button">Show all</button>
      <button class="btn" id="btnFit" type="button">Fit view</button>
      <label class="btn" for="filePick">Open .glb</label>
      <input type="file" id="filePick" accept=".glb,.gltf" hidden>
    </div>
  </header>

  <aside id="left">
    <section>
      <div class="tabs">
        <button class="btn on" id="tabObjects" type="button">Objects</button>
        <button class="btn" id="tabLog" type="button">Work log</button>
      </div>
      <div id="paneObjects">
        <div class="chips" id="chips" aria-label="Category filters"></div>
        <input id="search" type="search" placeholder="Filter by name" aria-label="Filter objects">
        <ul id="list"></ul>
      </div>
      <div id="paneLog" hidden>
        <ul id="log"></ul>
      </div>
    </section>
    <section>
      <details class="auditbox">
        <summary><span class="label">Model readiness</span></summary>
        <ul class="audit" id="audit"></ul>
      </details>
    </section>
  </aside>

  <main>
    <div id="stage"></div>
    <div id="status">Loading model…</div>
    <div id="tip" hidden></div>
    <div id="toast" hidden></div>
    <div id="aim" hidden></div>
    <section class="card" id="card" hidden></section>
    <div id="drop" hidden>Drop .glb to load</div>
    <div class="hint" id="hint"></div>
    <div id="pad" hidden>
      <span></span><button type="button" data-k="w" aria-label="Forward">▲</button><span></span>
      <button type="button" data-k="arrowleft" aria-label="Turn left">◀</button><button type="button" data-k="s" aria-label="Back">▼</button><button type="button" data-k="arrowright" aria-label="Turn right">▶</button>
    </div>
  </main>

</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const stage = $('stage');
const SIGNAL = new THREE.Color('#ff8a3d');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1620');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(5, 10, 7); scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let root = null, grid = null, items = [], selected = null, hovered = null, xray = false;
let bounds = new THREE.Box3(), lastHit = null, formKind = null;
const pins = new THREE.Group(); scene.add(pins);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// An object's key is the permanent id stamped into the model (scripts/stamp_ids.py). Models without ids fall back to the object name.
const slug = key => 'o-' + String(key).trim().replace(/[^A-Za-z0-9_~:@+-]+/g, '-');
const CATS = [['lsa', 'Lifesaving'], ['ffe', 'Fire equipment'], ['firedet', 'Fire detection'], ['emg', 'Emergency and medical'], ['acc', 'Access and openings'],
  ['mec', 'Propulsion and machinery'], ['ele', 'Electrical'], ['pip', 'Piping, valves and tanks'], ['hvc', 'HVAC and refrigeration'], ['nav', 'Navigation, comms and AV/IT'],
  ['dek', 'Deck equipment, tenders and toys'], ['int', 'Interior and stowage'], ['gal', 'Galley'], ['str', 'Structure and coatings']];
const catName = Object.fromEntries(CATS), catOff = new Set();
// Category comes from the model's "category" property when the designer set one, otherwise from what was chosen in the viewer.
const catOf = it => catName[it.meta.category] ? it.meta.category : (catName[objs[slug(it.key)]?.category] ? objs[slug(it.key)].category : '');
function applyVis() { items.forEach(i => i.obj.visible = !i.hidden && !catOff.has(catOf(i))); }
function renderChips() {
  const n = {}; items.forEach(i => n[catOf(i)] = (n[catOf(i)] || 0) + 1);
  const row = [...CATS, ['', 'Uncategorised']].filter(([k]) => n[k]);
  $('chips').innerHTML = row.length > 1 || (row[0] && row[0][0]) ? row.map(([k, l]) => `<button type="button" class="chip ${catOff.has(k) ? 'off' : ''}" data-cat="${k}" aria-pressed="${!catOff.has(k)}">${l} ${n[k]}</button>`).join('') : '';
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { const k = b.dataset.cat; catOff.has(k) ? catOff.delete(k) : catOff.add(k); if (selected && catOff.has(catOf(selected))) select(null); refresh(); });
}
let toastTimer; function toast(t) { $('toast').textContent = t; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, 4000); }

// ---- Store: defects, jobs and added details. Shared database when published, this browser otherwise.
let db = null, records = [], objs = {};
const LS = 'vessel-walkthrough';
const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify({ records, objs })); } catch {} };
const fail = e => toast(e?.code === 'invalid_argument' ? 'You have view-only access, so this was not saved.' : 'Could not save. Try again.');
async function initStore() {
  try { db = await window.claude?.use?.('db') ?? null; } catch { db = null; }
  if (db) {
    $('storeState').textContent = 'Shared log';
    db.collection('records').onSnapshot(s => { records = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, () => { $('storeState').textContent = 'Log unavailable'; });
    db.collection('objects').onSnapshot(s => { objs = {}; s.docs.forEach(d => objs[d.id] = d.data()); refresh(); }, () => {});
  } else {
    $('storeState').textContent = 'Log saved in this browser only';
    try { const d = JSON.parse(localStorage.getItem(LS) || '{}'); records = d.records || []; objs = d.objs || {}; } catch {}
    refresh();
  }
}
function putRecord(r) {
  const { id, ...data } = r;
  if (db) return db.collection('records').doc(id).set(data).catch(fail);
  records = records.filter(x => x.id !== id).concat(r); lsSave(); refresh();
}
function dropRecord(id) {
  if (db) return db.collection('records').doc(id).delete().catch(fail);
  records = records.filter(x => x.id !== id); lsSave(); refresh();
}
function putObj(it, patch) {
  const doc = { fields: {}, category: '', ...objs[slug(it.key)], name: it.name.trim(), ...patch };
  if (db) return db.collection('objects').doc(slug(it.key)).set(doc).catch(fail);
  objs[slug(it.key)] = doc; lsSave(); refresh();
}
const recsOf = it => records.filter(r => r.object === it.key).sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || String(b.created).localeCompare(String(a.created)));
const itemOf = r => items.find(i => i.key === r.object);
const glyph = r => `<span class="glyph ${r.kind === 'job' ? 'job' : ''} ${r.status === 'closed' ? 'closed' : ''}">${r.kind === 'job' ? 'J' : '!'}</span>`;
const day = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const metaLine = r => [r.kind === 'job' ? 'Job' : 'Defect', r.level, r.status === 'closed' ? 'closed' : 'open', r.due ? 'due ' + day(r.due) : '', r.pp ? 'Pinpoint ' + r.pp : '', 'logged ' + day(r.created)].filter(Boolean).join(' · ');

const pinTex = {};
function pinTexture(kind, closed) {
  const k = kind + closed; if (pinTex[k]) return pinTex[k];
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = closed ? '#8ea3b6' : kind === 'job' ? '#5cb8e6' : '#ff5d5d';
  g.beginPath(); g.arc(32, 32, 26, 0, 7); g.fill(); g.lineWidth = 5; g.strokeStyle = '#0d1620'; g.stroke();
  g.fillStyle = '#0d1620'; g.font = '600 36px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(kind === 'job' ? 'J' : '!', 32, 35);
  return pinTex[k] = new THREE.CanvasTexture(c);
}
function pinPoint(r, it) { return r.point ? new THREE.Vector3(...r.point) : new THREE.Box3().setFromObject(it.obj).getCenter(new THREE.Vector3()); }
function renderPins() {
  pins.clear();
  records.forEach(r => {
    const it = itemOf(r); if (!it || !it.obj.visible) return;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: pinTexture(r.kind, r.status === 'closed'), depthTest: false, sizeAttenuation: false }));
    s.scale.setScalar(0.045); s.position.copy(pinPoint(r, it)); s.renderOrder = 10; s.userData._item = it; s.userData._rec = r; pins.add(s);
  });
}
function renderLog() {
  const live = records.filter(itemOf).sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || String(b.created).localeCompare(String(a.created)));
  const open = live.filter(r => r.status !== 'closed').length;
  $('tabLog').textContent = `Work log (${open})`;
  $('log').innerHTML = live.length ? '' : '<li class="empty">Nothing logged yet. Click an object, then Log defect or Pin job.</li>';
  live.forEach(r => {
    const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `${glyph(r)}<span><span>${esc(r.title)}</span><span class="sub">${esc(r.object)} · ${esc(metaLine(r))}</span></span>`;
    b.onclick = () => { const it = itemOf(r); select(it); focusOn(it.obj); };
    li.appendChild(b); $('log').appendChild(li);
  });
}
function refresh() { applyVis(); renderChips(); renderPins(); renderLog(); renderList(); renderCard(); }
const box = new THREE.Box3Helper(new THREE.Box3(), SIGNAL); box.visible = false; scene.add(box);

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// Count geometrically disconnected pieces (vertices welded by position).
function looseParts(meshes) {
  let total = 0;
  for (const m of meshes) {

  keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { if (e.key === ' ' && !typing(e)) e.preventDefault(); keys.delete(e.key.toLowerCase()); });
addEventListener('blur', () => keys.clear());
$('pad').querySelectorAll('button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); keys.add(b.dataset.k); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys.delete(b.dataset.k)));
});
$('btnWalk').onclick = () => root && setWalk(!walking);
const tab = log => { $('paneLog').hidden = !log; $('paneObjects').hidden = log; $('tabLog').classList.toggle('on', log); $('tabObjects').classList.toggle('on', !log); };
$('tabObjects').onclick = () => tab(false); $('tabLog').onclick = () => tab(true);


$('search').addEventListener('input', renderList);
$('btnFit').onclick = () => { if (walking) setWalk(false); else if (root) fit(root); };
$('btnShow').onclick = () => { items.forEach(i => i.hidden = false); catOff.clear(); refresh(); if (root && !walking) fit(root); };
$('btnXray').onclick = () => { xray = !xray; $('btnXray').classList.toggle('on', xray); paint(); };

// Load another model: file picker or drag-and-drop
function openFile(f) { if (f) load(f, f.name); }
$('filePick').addEventListener('change', e => openFile(e.target.files[0]));
const main = document.querySelector('main');
main.addEventListener('dragover', e => { e.preventDefault(); $('drop').hidden = false; });
main.addEventListener('dragleave', e => { if (!main.contains(e.relatedTarget)) $('drop').hidden = true; });
main.addEventListener('drop', e => { e.preventDefault(); $('drop').hidden = true; openFile(e.dataTransfer.files[0]); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), 0.1); if (walking) stepWalk(dt); else controls.update(); renderer.render(scene, camera); });
setWalk(false);
resize();
load('trial.json', 'House.blend · designer trial, duplicates split');
initStore();
</script>
